name: Deploy to GitHub Pages

# 작업 브랜치에 푸시되면 자동으로 GitHub Pages에 배포합니다.
# 수동 실행(workflow_dispatch)도 가능합니다.
on:
  push:
    branches:
      - claude/vibrant-maxwell-Rm6B3
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 한 번만 배포 (진행 중이면 큐잉)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages가 꺼져 있으면 자동으로 켜고(enablement) 설정을 가져옵니다
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 배포할 파일만 _site 로 모음 (.git/.github 등 제외)
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -f README.md ] && cp README.md _site/ || true

      # 정적 사이트 아티팩트 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 실제 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
